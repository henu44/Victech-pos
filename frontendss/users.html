<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users</title>

    <link rel="stylesheet" href="users.css">
</head>

<body>

    <!-- Header -->
    <header class="users-header">

        <button class="icon-bt" aria-label="Back"
                onclick="goTo('Dashboad.html')">

            <svg width="30" height="20" viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M19 12H5M12 19l-7-7 7-7"/>

            </svg>

        </button>

        <h1>Users</h1>

        <button class="add-user-btn">
            + Add User
        </button>

    </header>


    <!-- Main content -->
    <main class="users-container">

        <!-- Page heading -->
        <div class="page-title">
            <h2>System Users</h2>
            <p>Manage users and their roles.</p>
        </div>


        <!-- Users table -->
        <div class="users-table-container">

            <table class="users-table">

                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="users-list">

                    <!-- Users will be added here later by JavaScript -->

                </tbody>

            </table>

        </div>

    </main>


    <script>

        function goTo(page) {
            window.location.href = page;
        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Current Sale</title>

    <link rel="stylesheet" href="addtosale.css">
</head>

<body>

    <!-- Header -->
    <header class="sale-header">

        <button class="back-btn" onclick="goBack()">
            ←
        </button>

        <div>
            <h1>Current Sale</h1>
            <p>Products added to this sale</p>
        </div>

    </header>


    <!-- Main content -->
    <main class="sale-container">

        <!-- Sale items -->
        <section class="sale-items">

            <h2>Sale Items</h2>

            <!-- Example product -->
            <div  id="sale-list">

                <!-- <div class="product-info">
                    <h3>Samsung A16</h3>
                    <p>KES 20,000 each</p>
                </div>

                <div class="quantity">
                    <button>-</button>

                    <span>1</span>

                    <button>+</button>
                </div>

                <div class="item-total">
                    KES 20,000
                </div>

                <button class="remove-btn">
                    ×
                </button> -->

            </div>


           

        </section>


        <!-- Sale summary -->
        <section class="sale-summary">

            <h2>Sale Summary</h2>

            <div class="summary-row">
                <span>Items</span>
                <span id="total-items">0</span>
            </div>

           

            <div class="summary-row total">
                <span>Total</span>
                <span id="total-price">KES 0</span>
            </div>

            <button class="checkout-btn" onclick="openPopup()">
                Proceed to Payment
            </button>

           <div id="payment-popup" class="payment-popup">

                <div class="payment-box">

                    <h2>Payment Type</h2>

                    <div class="payment-buttons">
                        <button id="cash-btn">Cash</button>
                        <button id="mobile-money-btn">Mobile Money</button>
                    </div>

                    <button id="close-payment" onclick="closePopup()">Cancel</button>

                </div>

            </div>

        </section>

    </main>


    <script>

        function goBack() {
            window.location.href="Dashboad.html";
        }

        function openPopup(){
            document.getElementById("payment-popup").style.display = "block";

        }
        function closePopup(){
            document.getElementById("payment-popup").style.display = "none";
        }


        const saleList = document.getElementById("sale-list");
        
        const sale = JSON.parse(localStorage.getItem("currentSale")) || [];
        let totalItems = 0;
        let totalPrice = 0;

        sale.forEach(function(product) {
            totalItems += product.quantity;
            totalPrice += product.price * product.quantity;
        });

        document.getElementById("total-items").textContent = totalItems;
        document.getElementById("total-price").textContent = "KES " + totalPrice;

        sale.forEach(function(product) {
            const saleItem = document.createElement("div");
            saleItem.className = "sale-item";

             saleItem.innerHTML = `
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p>KES ${product.price} each</p>
                </div>

                <div class="quantity">
                    <button class = "minus-btn">-</button>
                    <span>${product.quantity}</span>
                    <button class = "plus-btn">+</button>
                </div>

                <div class="item-total">
                    KES ${product.price * product.quantity}
                </div>

                <button class="remove-btn">×</button>
            `;

            saleList.appendChild(saleItem);

            const removeButton = saleItem.querySelector(".remove-btn");

            removeButton.onclick = function() {
                sale.splice(sale.indexOf(product), 1);

                localStorage.setItem("currentSale", JSON.stringify(sale));

                location.reload();
            };

            const plusButton = saleItem.querySelector(".plus-btn");

            plusButton.onclick = function() {
                product.quantity += 1;

                localStorage.setItem("currentSale", JSON.stringify(sale));

                location.reload();
            };

            const minus_btn = saleItem.querySelector(".minus-btn");
            minus_btn.onclick = function(){
                if(product.quantity > 1){
                    product.quantity -= 1;

                    localStorage.setItem("currentSale",JSON.stringify(sale));
                    location.reload();

                }else {
                    alert("Quantity cannot be less than 1")
                }
                

                
            }
                        
            
        });

        document.getElementById("cash-btn").onclick = async function() {

            const saleData = {
                payment_type: "cash",
                products: sale.map(function(product) {
                    return {
                        id: product.id,
                        quantity: product.quantity
                    };
                })
            };


            const response = await fetch("http://127.0.0.1:8000/sales",{
                method : "POST",
                headers : {
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify(saleData)

            });

            const data = await response.json();


            if (response.ok) {

                alert("Sale completed successfully!");

                localStorage.removeItem("currentSale");

                window.location.href = "products.html";

            } else {

                alert(data.message || "Sale failed.");

            }



            
        };
       

    </script> 

</body>
</html>
